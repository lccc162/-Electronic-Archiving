{% extends "layout.html" %}

{% block title %}تعديل المستخدم - برنامج الأرشفة المركزية{% endblock %}

{% block content %}
    <div class="page-card">
        <div class="card-header">
            <span>تعديل بيانات المستخدم: {{ user.full_name }}</span>
            <a href="{{ url_for('users') }}" style="color: white; text-decoration: none;"><i class="fas fa-arrow-left"></i> رجوع</a>
        </div>
        <div class="card-body">
            <form method="POST">
                <div class="form-grid">
                    <div class="form-group">
                        <label>الاسم الكامل :</label>
                        <input type="text" name="full_name" value="{{ user.full_name }}" required>
                    </div>
                    <div class="form-group">
                        <label>اسم المستخدم :</label>
                        <input type="text" name="username" value="{{ user.username }}" required>
                    </div>
                    <div class="form-group">
                        <label>الصلاحية :</label>
                        <select name="role">
                            <option value="موظف" {% if user.role == 'موظف' %}selected{% endif %}>موظف</option>
                            <option value="رئيس قسم" {% if user.role == 'رئيس قسم' %}selected{% endif %}>رئيس قسم</option>
                            <option value="مدير البرنامج" {% if user.role == 'مدير البرنامج' %}selected{% endif %}>مدير البرنامج</option>
                            <option value="مشاهدة فقط" {% if user.role == 'مشاهدة فقط' %}selected{% endif %}>مشاهدة فقط</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>القسم / الشعبة :</label>
                        <select name="department">
                            {% for dept in departments %}
                            <option value="{{ dept.name }}" {% if user.department == dept.name %}selected{% endif %}>{{ dept.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="form-group">
                        <label>كلمة المرور الجديدة (اتركه فارغاً للحفظ):</label>
                        <input type="password" name="password" placeholder="********">
                    </div>
                </div>
                <div style="margin-top: 20px;">
                    <button type="submit" class="btn btn-primary">حفظ التعديلات</button>
                </div>
            </form>
        </div>
    </div>
{% endblock %}
