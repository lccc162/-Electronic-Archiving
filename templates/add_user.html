{% extends "layout.html" %}

{% block title %}إضافة مستخدم جديد - برنامج الأرشفة المركزية{% endblock %}

{% block content %}
    <div class="page-card">
        <div class="card-header">
            <span>إضافة مستخدم جديد للنظام</span>
            <a href="{{ url_for('users') }}" style="color: white; text-decoration: none;"><i class="fas fa-arrow-left"></i> رجوع لإدارة المستخدمين</a>
        </div>
        <div class="card-body">
            <form action="{{ url_for('users') }}" method="POST">
                <div class="form-grid">
                    <div class="form-group">
                        <label>الاسم الكامل :</label>
                        <input type="text" name="full_name" placeholder="أدخل الاسم الثلاثي" required>
                    </div>
                    <div class="form-group">
                        <label>اسم المستخدم (Username):</label>
                        <input type="text" name="username" placeholder="مثلاً: ahmad_ali" required>
                    </div>
                    <div class="form-group">
                        <label>الصلاحية :</label>
                        <select name="role">
                            <option value="موظف">موظف</option>
                            <option value="رئيس قسم">رئيس قسم</option>
                            <option value="مدير البرنامج">مدير البرنامج</option>
                            <option value="مشاهدة فقط">مشاهدة فقط</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>القسم / الشعبة:</label>
                        <select name="department" required>
                            {% for dept in departments %}
                            <option value="{{ dept.name }}">{{ dept.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="form-group">
                        <label>كلمة المرور :</label>
                        <input type="password" name="password" placeholder="أدخل كلمة المرور" required>
                    </div>
                </div>
                
                <div style="margin-top: 20px; text-align: left;">
                    <button type="submit" class="btn btn-primary">إضافة المستخدم وحفظ البيانات</button>
                </div>
            </form>
        </div>
    </div>
{% endblock %}
