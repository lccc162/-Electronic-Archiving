{% extends "layout.html" %}

{% block title %}تعديل القسم - برنامج الأرشفة المركزية{% endblock %}

{% block content %}
    <div class="page-card">
        <div class="card-header">
            <span>تعديل القسم / الجهة: {{ dept.name }}</span>
            <a href="{{ url_for('departments') }}" style="color: white; text-decoration: none;"><i class="fas fa-arrow-left"></i> رجوع</a>
        </div>
        <div class="card-body">
            <form method="POST">
                <div class="form-group">
                    <label>اسم القسم / الجهة :</label>
                    <input type="text" name="name" value="{{ dept.name }}" required>
                </div>
                <div class="form-group">
                    <label>رقم القسم :</label>
                    <input type="text" name="dept_number" value="{{ dept.dept_number or '' }}">
                </div>
                <div style="margin-top: 20px;">
                    <button type="submit" class="btn btn-primary">حفظ التغييرات</button>
                </div>
            </form>
        </div>
    </div>
{% endblock %}
