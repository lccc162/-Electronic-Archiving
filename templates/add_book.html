{% extends "layout.html" %}

{% block title %}إضافة كتاب جديد - برنامج الأرشفة المركزية{% endblock %}

{% block content %}
    <div class="page-card">
        <div class="card-header">
            <span>إضافة كتاب جديد</span>
            <i class="fas fa-chevron-down"></i>
        </div>
        <div class="card-body">
            <form method="POST" enctype="multipart/form-data">
                <div class="form-grid">
                    <div class="form-group">
                        <label>نوع الكتاب :</label>
                        <select name="book_type" required>
                            <option value="">-- اختر النوع --</option>
                            {% for type in types %}
                            <option value="{{ type.name }}">{{ type.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="form-group">
                        <label>رقم الكتاب:</label>
                        <input type="text" name="book_number">
                    </div>
                    <div class="form-group">
                        <label>تاريخ الكتاب :</label>
                        <input type="date" name="book_date">
                    </div>
                    <div class="form-group">
                        <label>الجهة المصدرة للكتاب:</label>
                        <select name="source" required>
                            <option value="">-- اختر الجهة --</option>
                            {% for dept in departments %}
                            <option value="{{ dept.name }}">{{ dept.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="form-group">
                        <label>المرسل الى:</label>
                        <select name="receiver" required>
                            <option value="">-- اختر الجهة --</option>
                            {% for dept in departments %}
                            <option value="{{ dept.name }}">{{ dept.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="form-group">
                        <label>عنوان الكتاب :</label>
                        <input type="text" name="title">
                    </div>
                    
                    <div class="form-group full-width">
                        <label>محتوى الكتاب والمرفقات:</label>
                        <textarea rows="6" name="content"></textarea>
                    </div>
                    
                    <div class="form-group full-width">
                        <label>كلمات دليلية:</label>
                        <textarea rows="2" name="keywords"></textarea>
                    </div>

                    <div class="form-group full-width">
                        <label style="color: red;">اختر المرفق:</label>
                        <div class="file-input-container">
                            <input type="file" name="attachment">
                        </div>
                    </div>

                    <div class="form-group">
                        <label>رقم الفايل:</label>
                        <input type="text" name="file_number">
                    </div>
                    <div class="form-group">
                        <label>رقم الخزن:</label>
                        <input type="text" name="storage_number">
                    </div>
                    <div class="form-group">
                        <label style="color: #f59e0b;"><i class="fas fa-calendar-check"></i> تاريخ المتابعة:</label>
                        <input type="date" name="follow_up_date">
                    </div>
                </div>
                
                <div style="margin-top: 20px; text-align: left;">
                    <button type="submit" class="btn btn-primary">حفظ الكتاب</button>
                </div>
            </form>
        </div>
    </div>
{% endblock %}
